[package]
name = "atropos-libafl"
version = "0.1.0"
edition = "2021"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3

[dependencies]
libafl = { path = "/home/user/LibAFL/crates/libafl" }
libafl_bolts = { path = "/home/user/LibAFL/crates/libafl_bolts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
libc = "0.2"
agent-client-protocol = "2.2"
futures = "0.3"

[build-dependencies]
cc = "1"
