[package]
name = "atropos-libafl"
version = "0.1.0"
edition = "2021"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.nyx]
inherits = "release"
panic = "unwind"

[features]
default = ["nyx"]
nyx = []

[dependencies]
libafl = "=0.16.1"
libafl_bolts = "=0.16.1"
libafl_nyx = { version = "=0.16.1", path = "vendor/libafl_nyx" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
libc = "0.2"
agent-client-protocol = "2.2"
futures = "0.3"
